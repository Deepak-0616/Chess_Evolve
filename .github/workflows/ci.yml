name: Chess Evolve Production CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  ci-pipeline:
    name: Full CI Pipeline (Node 22, Postgres 16, Python 3.10)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chess_evolve_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chess_evolve_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # CI uses only its disposable PostgreSQL service.
    # Do not use production database secrets in this job.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chess_evolve_test
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chess_evolve_test
      NODE_ENV: test
      SUPABASE_URL: https://placeholder.supabase.co
      SUPABASE_ANON_KEY: placeholder-anon-key
      JWT_SECRET: test-jwt-secret-key-32-characters-long-chess-evolve

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Verify Prisma Environment
        working-directory: backend
        run: |
          test -n "$DATABASE_URL"
          test -n "$DIRECT_DATABASE_URL"
          echo "Both Prisma database variables are set."

      - name: Prisma Schema Validation
        working-directory: backend
        run: npx prisma validate --schema=../prisma/schema.prisma

      - name: Prisma Client Generation
        working-directory: backend
        run: npm run prisma:generate

      - name: Prisma Migrations
        working-directory: backend
        run: npx prisma migrate deploy --schema=../prisma/schema.prisma

      - name: Run Backend Vitest Test Suite
        working-directory: backend
        run: npm test

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt

      - name: Install ML Service Dependencies
        working-directory: ml-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ML Pytest Suite
        working-directory: ml-service
        run: python -m pytest app/tests

      - name: Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend-build:
    name: Frontend Production Build (Node 22)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend Production Bundle
        working-directory: frontend
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-key
          VITE_API_BASE_URL: /api/v1
        run: npm run build
